<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad Sketch App - XXL UI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none; 
        }

        /* De vernieuwde grotere toolbar */
        #toolbar {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px; /* Neemt nu bijna de hele breedte in op de iPad */
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px); /* Mooi Apple-achtig effect */
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 10;
        }

        /* Kleurkiezer groter maken */
        #colorPicker {
            width: 60px;
            height: 60px;
            border: none;
            padding: 0;
            background: none;
            cursor: pointer;
        }

        /* Schuifregelaar voor lijndikte (Input Range) */
        #lineWidth {
            flex-grow: 1; /* Neemt de rest van de ruimte in */
            height: 15px;
            cursor: pointer;
        }

        /* De Wisknop: Groter en duidelijker */
        #clearBtn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #ff3b30; /* Apple rood */
            border: none;
            border-radius: 10px;
            cursor: pointer;
            active: opacity: 0.7;
        }

        canvas {
            display: block;
            background-color: white;
        }

        label {
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>

<div id="toolbar">
    <div style="display: flex; align-items: center; gap: 10px;">
        <label>Color:</label>
        <input type="color" id="colorPicker" value="#000000">
    </div>

    <div style="display: flex; flex-direction: column; flex-grow: 1; gap: 5px;">
        <label>Size:</label>
        <input type="range" id="lineWidth" min="1" max="50" value="5">
    </div>

    <button id="clearBtn">CLEAR</button>
</div>

<canvas id="sketchPad"></canvas>

<script>
    const canvas = document.getElementById('sketchPad');
    const ctx = canvas.getContext('2d');
    const colorPicker = document.getElementById('colorPicker');
    const lineWidth = document.getElementById('lineWidth');
    const clearBtn = document.getElementById('clearBtn');

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let drawing = false;

    function startDrawing(e) {
        drawing = true;
        draw(e);
    }

    function stopDrawing() {
        drawing = false;
        ctx.beginPath();
    }

    function draw(e) {
        if (!drawing) return;

        const rect = canvas.getBoundingClientRect();
        // Gebruik e.touches[0] voor touch of e voor muis
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const x = clientX - rect.left;
        const y = clientY - rect.top;

        ctx.strokeStyle = colorPicker.value;
        ctx.lineWidth = lineWidth.value;

        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }

    // Touch events voor iPad
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);

    // Muis events voor Macbook
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    // Wissen
    clearBtn.addEventListener('click', () => {
        if(confirm("Are you sure")) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    });
</script>

</body>
</html>
